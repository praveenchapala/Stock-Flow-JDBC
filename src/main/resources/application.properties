
spring.application.name=stockflow

# Database configuration
spring.datasource.url=${STOCKFLOW_DB_URL:jdbc:mysql://localhost:3306/stockflow}
spring.datasource.username=${STOCKFLOW_DB_USER}
spring.datasource.password=${STOCKFLOW_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=StockFlowPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
